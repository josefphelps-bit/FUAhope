<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Funds Usage Acknowledgement</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #ffffff;
      color: #252c3e;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .form-container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 15px 20px 30px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 600;
    }

    .required {
      color: #e11d2e;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"] {
      width: 100%;
      height: 46px;
      padding: 10px 12px;
      border: 1px solid #b8bfd6;
      border-radius: 4px;
      background: #ffffff;
      color: #252c3e;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus {
      border-color: #2d2e97;
      box-shadow: 0 0 0 2px rgba(45, 46, 151, 0.08);
    }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .helper {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: #596070;
    }

    /* CONSENT */

    .consent-box {
      margin: 26px 0 28px;
      padding: 17px;
      background: #f7f7fa;
      border: 1px solid #e1e4ec;
      border-radius: 5px;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      cursor: pointer;
    }

    .consent input {
      width: 21px;
      height: 21px;
      margin: 1px 0 0;
      flex: 0 0 21px;
      accent-color: #2d2e97;
    }

    /* SIGNATURE */

    .signature-box {
      width: 100%;
      height: 140px;
      border: 1px solid #b8bfd6;
      border-radius: 4px;
      background: #ffffff;
      overflow: hidden;
      touch-action: none;
    }

    #signatureCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .signature-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .clear-signature {
      padding: 5px 2px;
      border: 0;
      background: transparent;
      color: #2d2e97;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    /* SUBMIT */

    .submit-wrap {
      text-align: center;
      margin-top: 28px;
    }

    .submit-button {
      min-width: 140px;
      padding: 13px 28px;
      border: 0;
      border-radius: 30px;
      background: #2db6a3;
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .status {
      display: none;
      margin: 18px auto 0;
      padding: 14px;
      border-radius: 5px;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    .status.success {
      display: block;
      background: #edf8f5;
      color: #176b5d;
    }

    .status.error {
      display: block;
      background: #fff0f0;
      color: #a51d2d;
    }

    @media (max-width: 600px) {

      .form-container {
        padding: 10px 14px 25px;
      }

      .name-row {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .field {
        margin-bottom: 19px;
      }

      .consent-box {
        margin: 22px 0 24px;
        padding: 14px;
      }

      .signature-box {
        height: 125px;
      }
    }
  </style>
</head>

<body>

  <main class="form-container">

    <form id="fundsForm">

      <!-- NAME -->

      <div class="field">

        <label>
          Name <span class="required">*</span>
        </label>

        <div class="name-row">

          <div>
            <input
              type="text"
              id="firstName"
              name="firstName"
              required
              autocomplete="given-name"
            >

            <span class="helper">
              First Name
            </span>
          </div>

          <div>
            <input
              type="text"
              id="lastName"
              name="lastName"
              required
              autocomplete="family-name"
            >

            <span class="helper">
              Last Name
            </span>
          </div>

        </div>

      </div>


      <!-- EMAIL -->

      <div class="field">

        <label for="email">
          Email <span class="required">*</span>
        </label>

        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="email"
        >

      </div>


      <!-- CONSENT -->

      <div class="consent-box">

        <label class="consent">

          <input
            type="checkbox"
            id="consent"
            required
          >

          <span>
            I acknowledge that I have read and agree with all of the terms above and confirm consent.
            <span class="required">*</span>
          </span>

        </label>

      </div>


      <!-- PRINTED NAME -->

      <div class="field">

        <label for="printedName">
          Printed Name <span class="required">*</span>
        </label>

        <input
          type="text"
          id="printedName"
          name="printedName"
          required
          autocomplete="name"
        >

      </div>


      <!-- SIGNATURE -->

      <div class="field">

        <label>
          Signature <span class="required">*</span>
        </label>

        <div class="signature-box">
          <canvas id="signatureCanvas"></canvas>
        </div>

        <div class="signature-actions">

          <button
            type="button"
            class="clear-signature"
            id="clearSignature"
          >
            Clear signature
          </button>

        </div>

      </div>


      <!-- DATE -->

      <div class="field">

        <label for="dateSigned">
          Date Signed <span class="required">*</span>
        </label>

        <input
          type="date"
          id="dateSigned"
          name="dateSigned"
          required
        >

      </div>


      <!-- SUBMIT -->

      <div class="submit-wrap">

        <button
          type="submit"
          class="submit-button"
          id="submitButton"
        >
          Submit
        </button>

        <div
          id="status"
          class="status"
          role="status"
          aria-live="polite"
        ></div>

      </div>

    </form>

  </main>


  <script>

    /* GOOGLE SHEET CONNECTION */

    const GOOGLE_SCRIPT_URL =
      "https://script.google.com/a/macros/hope-charities.org/s/AKfycbzsZTjaakfPlSK0_Qc0ZGLXaGhbnGiWXMJjH8PdlqtC8i9yKw6Ku0uBkVx5-oAOurVQFA/exec";


    /* DATE */

    const dateField =
      document.getElementById("dateSigned");

    const today = new Date();

    const localToday =
      today.getFullYear() +
      "-" +
      String(today.getMonth() + 1).padStart(2, "0") +
      "-" +
      String(today.getDate()).padStart(2, "0");

    dateField.value = localToday;


    /* SIGNATURE PAD */

    const canvas =
      document.getElementById("signatureCanvas");

    const ctx =
      canvas.getContext("2d");

    let drawing = false;
    let hasSignature = false;


    function prepareCanvas() {

      const rect =
        canvas.getBoundingClientRect();

      const ratio =
        Math.max(window.devicePixelRatio || 1, 1);

      canvas.width =
        Math.round(rect.width * ratio);

      canvas.height =
        Math.round(rect.height * ratio);

      ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );

      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#252c3e";
    }


    prepareCanvas();


    function getPosition(event) {

      const rect =
        canvas.getBoundingClientRect();

      let clientX;
      let clientY;

      if (event.touches && event.touches.length) {

        clientX =
          event.touches[0].clientX;

        clientY =
          event.touches[0].clientY;

      } else if (
        event.changedTouches &&
        event.changedTouches.length
      ) {

        clientX =
          event.changedTouches[0].clientX;

        clientY =
          event.changedTouches[0].clientY;

      } else {

        clientX =
          event.clientX;

        clientY =
          event.clientY;
      }

      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }


    function startDrawing(event) {

      event.preventDefault();

      drawing = true;

      const position =
        getPosition(event);

      ctx.beginPath();

      ctx.moveTo(
        position.x,
        position.y
      );
    }


    function draw(event) {

      if (!drawing) {
        return;
      }

      event.preventDefault();

      const position =
        getPosition(event);

      ctx.lineTo(
        position.x,
        position.y
      );

      ctx.stroke();

      hasSignature = true;
    }


    function stopDrawing(event) {

      if (event) {
        event.preventDefault();
      }

      drawing = false;

      ctx.beginPath();
    }


    canvas.addEventListener(
      "mousedown",
      startDrawing
    );

    canvas.addEventListener(
      "mousemove",
      draw
    );

    window.addEventListener(
      "mouseup",
      stopDrawing
    );


    canvas.addEventListener(
      "touchstart",
      startDrawing,
      { passive: false }
    );

    canvas.addEventListener(
      "touchmove",
      draw,
      { passive: false }
    );

    canvas.addEventListener(
      "touchend",
      stopDrawing,
      { passive: false }
    );


    document
      .getElementById("clearSignature")
      .addEventListener(
        "click",
        function () {

          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          hasSignature = false;
        }
      );


    /* SUBMISSION */

    const form =
      document.getElementById("fundsForm");

    const submitButton =
      document.getElementById("submitButton");

    const status =
      document.getElementById("status");


    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        if (!form.checkValidity()) {

          form.reportValidity();

          return;
        }


        if (!hasSignature) {

          status.className =
            "status error";

          status.textContent =
            "Please provide your signature before submitting.";

          return;
        }


        submitButton.disabled = true;

        submitButton.textContent =
          "Submitting...";


        const submission = {

          firstName:
            document
              .getElementById("firstName")
              .value
              .trim(),

          lastName:
            document
              .getElementById("lastName")
              .value
              .trim(),

          email:
            document
              .getElementById("email")
              .value
              .trim(),

          consent:
            document
              .getElementById("consent")
              .checked,

          printedName:
            document
              .getElementById("printedName")
              .value
              .trim(),

          signature:
            canvas.toDataURL("image/png"),

          dateSigned:
            document
              .getElementById("dateSigned")
              .value
        };


        try {

          await fetch(
            GOOGLE_SCRIPT_URL,
            {
              method: "POST",

              mode: "no-cors",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify(submission)
            }
          );


          status.className =
            "status success";

          status.textContent =
            "Thank you! Your acknowledgement has been submitted.";

          submitButton.textContent =
            "Submitted";


        } catch (error) {

          console.error(error);

          status.className =
            "status error";

          status.textContent =
            "We couldn't submit your acknowledgement. Please try again.";

          submitButton.disabled =
            false;

          submitButton.textContent =
            "Submit";
        }

      }
    );

  </script>

</body>
</html>
