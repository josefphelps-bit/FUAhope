<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Funds Usage Acknowledgement</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow-x: hidden;
    }

    #zf_div_S2tdENK5d16TzKQYRmJfRFF9XqTjKc1CHTIOPuNrFok {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #zf_div_S2tdENK5d16TzKQYRmJfRFF9XqTjKc1CHTIOPuNrFok iframe {
      display: block;
      width: 100% !important;
      margin: 0;
      padding: 0;
      border: 0;
    }
  </style>
</head>

<body>

  <div id="zf_div_S2tdENK5d16TzKQYRmJfRFF9XqTjKc1CHTIOPuNrFok"></div>

  <script>
    (function () {

      const container = document.getElementById(
        "zf_div_S2tdENK5d16TzKQYRmJfRFF9XqTjKc1CHTIOPuNrFok"
      );

      /* -----------------------------------------
         CREATE ZOHO FORM
      ----------------------------------------- */

      const formIframe = document.createElement("iframe");

      let ifrmSrc =
        "https://forms.zohopublic.com/crmuser531/form/FundUsageAcknowledgement/formperma/S2tdENK5d16TzKQYRmJfRFF9XqTjKc1CHTIOPuNrFok?zf_rszfm=1";


      /* -----------------------------------------
         ADD REFERRER
      ----------------------------------------- */

      try {

        if (!(/[?&]referrername=/.test(ifrmSrc))) {

          let referrer = window.location.href;

          try {

            if (window.self !== window.top) {
              referrer = document.referrer || window.location.href;
            }

          } catch (e) {}


          if (referrer) {

            if (referrer.length > 1800) {

              const queryIndex = referrer.indexOf("?");

              if (queryIndex > -1) {
                referrer = referrer.substring(0, queryIndex);
              }

              if (referrer.length > 1800) {
                referrer = referrer.substring(0, 1800);
              }
            }

            ifrmSrc +=
              "&referrername=" +
              encodeURIComponent(referrer);
          }
        }

      } catch (e) {}


      /* -----------------------------------------
         FORM IFRAME SETTINGS
      ----------------------------------------- */

      formIframe.src = ifrmSrc;

      formIframe.style.width = "100%";
      formIframe.style.height = "2736px";
      formIframe.style.border = "none";
      formIframe.style.display = "block";
      formIframe.style.transition = "height 0.3s ease";

      formIframe.setAttribute(
        "aria-label",
        "Funds Usage Acknowledgement"
      );

      formIframe.setAttribute(
        "scrolling",
        "no"
      );

      container.appendChild(formIframe);


      /* -----------------------------------------
         REPORT PAGE HEIGHT TO PARENT
      ----------------------------------------- */

      function sendPageHeight() {

        requestAnimationFrame(function () {

          const height = Math.max(
            document.body.scrollHeight,
            document.body.offsetHeight,
            document.documentElement.scrollHeight,
            document.documentElement.offsetHeight
          );

          window.parent.postMessage(
            {
              type: "FUAhope-resize",
              height: height
            },
            "*"
          );

        });
      }


      /* -----------------------------------------
         RECEIVE ZOHO FORM RESIZE MESSAGE
      ----------------------------------------- */

      window.addEventListener(
        "message",
        function (event) {

          const eventData = event.data;


          /*
             Zoho sends its form height as a
             pipe-separated string.
          */

          if (
            eventData &&
            eventData.constructor === String
          ) {

            const data = eventData.split("|");


            if (
              data.length === 2 ||
              data.length === 3
            ) {

              const formPerma = data[0];

              const newHeight =
                parseInt(data[1], 10) + 15;


              if (
                formIframe.src.indexOf("formperma") > 0 &&
                formIframe.src.indexOf(formPerma) > 0 &&
                !isNaN(newHeight)
              ) {

                formIframe.style.height =
                  newHeight + "px";


                /*
                   If Zoho requests scrolling,
                   scroll form into view.
                */

                if (data.length === 3) {

                  setTimeout(function () {

                    formIframe.scrollIntoView({
                      behavior: "smooth",
                      block: "start"
                    });

                  }, 500);
                }


                /*
                   Tell the outer page our
                   new total height.
                */

                setTimeout(
                  sendPageHeight,
                  350
                );
              }
            }
          }
        },
        false
      );


      /* -----------------------------------------
         WATCH FOR SIZE CHANGES
      ----------------------------------------- */

      if ("ResizeObserver" in window) {

        const observer =
          new ResizeObserver(function () {

            sendPageHeight();

          });

        observer.observe(container);
      }


      /* -----------------------------------------
         INITIAL HEIGHT CHECKS
      ----------------------------------------- */

      window.addEventListener(
        "load",
        function () {

          sendPageHeight();

          setTimeout(sendPageHeight, 500);
          setTimeout(sendPageHeight, 1500);

        }
      );


      window.addEventListener(
        "resize",
        function () {

          setTimeout(
            sendPageHeight,
            100
          );

        }
      );

    })();
  </script>

</body>

</html>
